{% extends "base.html" %}
{% block title %}Dashboard{% endblock %}
{% block content %}
<h1>Dashboard</h1>
<p>Welcome to your dashboard.You can <a class="link_color" href="{% url "edit" %}">edit your
profile</a> or <a class="link_color" href="{% url "password_change" %}">change your password</a>.
</p>
<form id="logout-form" action="{% url "logout" %}" method="POST">
  {% csrf_token %}
  <button type="submit">Log out</button>
</form>
{% endblock %}
